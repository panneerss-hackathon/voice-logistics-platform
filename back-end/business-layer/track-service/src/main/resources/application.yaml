server:
  port: 8084

spring:
  datasource:
    url: jdbc:sqlserver://<DB-HOST>:1433;databaseName=trackingdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect

azure:
  servicebus:
    connection-string: ${AZURE_SERVICE_BUS_CONNECTION}
    topic: shipment-events

logging:
  level:
    root: INFO
    com.jarvis.tracking: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, info